<!DOCTYPE html>
<html lang="zh-CN" data-theme="cream">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeTrail 码途</title>
    <script>
      // 五主题：首帧前落 data-theme，避免闪烁（?theme= 优先，值合法性由 ThemeContext 兜底）
      try {
        var t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('ct-theme')
        if (['cream', 'matcha', 'ink', 'board', 'slate'].indexOf(t) >= 0) {
          document.documentElement.dataset.theme = t
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
